# Backend Configuration

## Database
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_system
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

## Server
server.port=8080
server.servlet.context-path=/api

## Logging
logging.level.root=INFO
logging.level.com.attendancesystem=DEBUG
logging.file.name=logs/attendance-system.log

## Face Recognition
face.recognition.threshold=0.75
face.recognition.model.path=models/face_recognition_model
face.image.storage.path=uploads/faces

## Attendance System
attendance.working.hours.start=09:00
attendance.working.hours.end=18:00
attendance.late.time=09:15

## GPS Tracking
gps.enabled=true
gps.accuracy.threshold=100
