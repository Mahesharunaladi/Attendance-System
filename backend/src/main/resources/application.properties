# Waste Management Attendance System - Application Properties

# ===========================
# Spring Boot Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_system
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.servlet.context-path=/api

# ===========================
# Application Configuration
# ===========================
app.name=Waste Management Attendance System
app.version=1.0.0
app.description=Face Recognition based Attendance System for Waste Management Workers

# ===========================
# Database Configuration
# ===========================
# MySQL Connection
db.host=localhost
db.port=3306
db.name=waste_management
db.user=root
db.password=your_password

# Hibernate Configuration
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.generate_statistics=false
hibernate.connection.pool_size=10
hibernate.max_fetch_depth=3

# ===========================
# Face Recognition Configuration
# ===========================
# Face Recognition Settings
face.match.threshold=0.75
face.cascade.classifier.path=haarcascade_frontalface_alt.xml
face.resize.width=224
face.resize.height=224
face.detection.scale.factor=1.1
face.detection.min.neighbors=4

# Face Image Storage
face.storage.path=data/faces
face.storage.max.size=10MB

# ===========================
# Attendance Configuration
# ===========================
# Working Hours
attendance.work.start.time=09:00
attendance.work.end.time=18:00
attendance.late.threshold.minutes=15
attendance.early.leave.threshold.minutes=15

# GPS Configuration
gps.enable=true
gps.accuracy.threshold=50.0

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.waste.management=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{ISO8601} [%t] %-5p %c{1} - %msg%n
logging.pattern.file=%d{ISO8601} [%t] %-5p %c{1} - %msg%n
logging.file.name=logs/attendance-system.log
logging.file.max.size=10MB
logging.file.max.history=30

# ===========================
# File Upload Configuration
# ===========================
upload.dir=uploads
upload.max.file.size=10MB
upload.allowed.extensions=jpg,jpeg,png,gif

# ===========================
# API Configuration
# ===========================
api.version=v1
api.base.path=/api/v1
api.request.timeout=30000
api.max.connections=100

# ===========================
# Cache Configuration
# ===========================
cache.enable=true
cache.ttl.minutes=60
cache.max.size=1000

# ===========================
# Email Configuration (Optional)
# ===========================
email.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.user=your_email@gmail.com
email.smtp.password=your_password
email.smtp.use.tls=true

# ===========================
# Reporting Configuration
# ===========================
report.output.path=reports
report.date.format=yyyy-MM-dd
report.time.format=HH:mm:ss
report.timezone=Asia/Kolkata

# ===========================
# Task Scheduler Configuration
# ===========================
scheduler.enable=true
scheduler.pool.size=5

# Daily attendance report generation
scheduler.daily.report.enabled=true
scheduler.daily.report.time=18:00

# Weekly statistics
scheduler.weekly.stats.enabled=true
scheduler.weekly.stats.day=FRIDAY
scheduler.weekly.stats.time=17:00

# ===========================
# Security Configuration
# ===========================
security.enable.https=false
security.jwt.secret=your_jwt_secret_key_here
security.jwt.expiration.hours=24
security.session.timeout.minutes=30

# ===========================
# Environmental Configuration
# ===========================
# Environment: development, staging, production
environment=development
debug.enabled=true
